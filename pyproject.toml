[project]
name = "atlas"
version = "0.1.0"
description = "Privacy-focused personal AI agent — local LLMs, granular permissions, secure API gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Atlas Contributors" }
]
keywords = ["ai", "agent", "llm", "privacy", "local", "ollama", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    # Agent Framework
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.0.10",
    "langchain-ollama>=0.1.0",
    
    # Gateway Server
    "fastapi>=0.100.0",
    "uvicorn>=0.25.0",
    
    # Tools
    "tavily-python>=0.3.0",
    
    # Google APIs
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.110.0",
    
    # CLI/UI
    "typer>=0.12.0",
    "rich>=13.0.0",
    
    # Config
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "keyring>=25.0.0",
    "platformdirs>=4.0.0",

    # Integration
    "slack_bolt>=1.18.0",
    "slack_sdk>=3.27.0",
    "Brotli>=1.1.0",  # Fix for aiohttp compression with Python 3.13
    
    # Web Reader
    "trafilatura>=1.6.0",

    # Remote LLM Providers (used on demand via /model command)
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
embeddings = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "sqlite-vec>=0.1.0",
]
menubar = [
    "rumps>=0.4.0",
]

[project.scripts]
atlas = "atlas.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]



[project.urls]
Homepage = "https://github.com/your-username/atlas"
Repository = "https://github.com/your-username/atlas"
Issues = "https://github.com/your-username/atlas/issues"
Changelog = "https://github.com/your-username/atlas/blob/main/CHANGELOG.md"

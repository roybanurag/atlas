services:
  atlas-sandbox:
    image: atlas-sandbox:latest
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        RUN apt-get update && apt-get install -y curl wget jq git && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir requests beautifulsoup4 pandas numpy scipy urllib3 yfinance matplotlib
        WORKDIR /workspace
        RUN useradd -m sandboxuser && chown -R sandboxuser /workspace
        USER sandboxuser
    # Command is explicitly overridden by the sandbox tool during runtime.
    # We include this compose file purely as an operational helper to build the image manually if desired.
    command: ["sleep", "infinity"]
